name: Update Borderly visa data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: borderly-visa-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download, convert and validate visa data
        run: node update_visa_data.mjs

      - name: Commit update if data changed
        shell: bash
        run: |
          if [[ ! -f update_result.txt ]] || ! grep -qx "updated" update_result.txt; then
            echo "No new visa data to publish."
            exit 0
          fi

          rm -f update_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visa_requirements.json version.json

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          VERSION=$(node -p "require('./version.json').version")
          git commit -m "Update Borderly visa data to v${VERSION}"
          git push
